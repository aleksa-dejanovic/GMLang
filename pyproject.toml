[project]
name = "gmlang"
version = "0.1.0"
description = "A DSL for graph definition and manipulation using parglare"
authors = [
    {name = "Aleksa Dejanović", email = "dejanovicaleksa234@gmail.com"},
]
maintainers = [
    {name = "Aleksa Dejanović", email = "dejanovicaleksa234@gmail.com"},
]
readme = "README.md"
license = "Apache-2.0"
keywords = ["parglare", "DSL", "graph"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

requires-python = ">=3.13"
dependencies = ["parglare==0.22.0"]

[dependency-groups]
dev = [
    {include-group = "test"},
    {include-group = "dbg"},
]
test = [
    "coverage>=7.12.0",
    "mypy>=1.19.0",
    "pytest>=9.0.1",
    "ruff>=0.14.8",
    "syrupy>=5.0.0",
]
dbg = [
    "ipython>=9.7.0",
    "pudb>=2025.1.3",
]

[tool.uv]
default-groups = []

[project.urls]
Homepage = "TODO"
Repository = "https://github.com/aleksa-dejanovic/GMLang"

[build-system]
build-backend = "flit_core.buildapi"
requires = ["flit_core >=3.8.0,<4"]

[tool.flit.module]
name = "gmlang"

[tool.flit.sdist]
exclude = ["**/.*"]

[tool.ruff]
line-length = 90
indent-width = 4

[tool.ruff.lint]
# https://docs.astral.sh/ruff/linter/#rule-selection
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

